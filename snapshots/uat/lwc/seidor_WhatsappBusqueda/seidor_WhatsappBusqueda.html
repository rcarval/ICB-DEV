<template>
    <lightning-card title="Buscador de Conversaciones de WhatsApp" icon-name="standard:messaging_conversation">
        <div class="slds-p-around_medium">

            <div class="slds-grid slds-gutters slds-grid_vertical-align-end slds-m-bottom_medium">
                <div class="slds-col slds-size_8-of-12">
                    <lightning-input
                        type="search"
                        label="Palabra clave o frase"
                        placeholder="Ej: reclamo, transferencia, tarjeta..."
                        value={searchTerm}
                        onchange={handleInputChange}
                        onkeyup={handleKeyUp}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_3-of-12">
                    <lightning-button
                        variant="brand"
                        label="Buscar en Chats"
                        icon-name="utility:search"
                        onclick={handleSearch}>
                    </lightning-button>
                </div>
            </div>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner>
            </template>

            <template if:true={hasResults}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">Sesión</th>
                            <th scope="col">Cliente</th>
                            <th scope="col">Mensaje Coincidente</th>
                            <th scope="col">Coincidencias</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={results} for:item="row">
                            <tr key={row.sessionId}>
                                <td>
                                    <a href={row.recordUrl} data-id={row.sessionId} onclick={navigateToSession}>
                                        {row.sessionName}
                                    </a>
                                </td>
                                <td>{row.endUserName}</td>
                                <td><lightning-formatted-rich-text value={row.matchingMessage}></lightning-formatted-rich-text></td>
                                <td>{row.matchCount}</td>
                                <td><lightning-formatted-date-time value={row.startTime} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></td>
                                <td>
                                    <lightning-button-icon
                                        icon-name="utility:preview"
                                        alternative-text="Ver Chat Completo"
                                        title="Ver Chat Completo"
                                        data-id={row.sessionId}
                                        data-enduser={row.endUserName}
                                        onclick={openChat}>
                                    </lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:true={noResultsFound}>
                <div class="slds-illustration slds-illustration_small slds-m-top_large">
                    <div class="slds-text-longform">
                        <h3 class="slds-text-heading_medium">Sin coincidencias</h3>
                        <p class="slds-text-body_regular">No se encontraron mensajes con "{searchedTerm}".</p>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium chat-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Cerrar" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Cerrar</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Conversación completa</h2>
                </header>

                <div class="slds-modal__content chat-scroll">
                    <template if:true={isModalLoading}>
                        <lightning-spinner alternative-text="Cargando chat" size="medium"></lightning-spinner>
                    </template>

                    <template if:false={isModalLoading}>
                        <template if:true={hasChatMessages}>
                            <template for:each={chatMessages} for:item="msg">
                                <div key={msg.messageId} class={msg.rowClass}>
                                    <div class={msg.bubbleClass}>
                                        <span class="sender-label">{msg.senderLabel}</span>
                                        <lightning-formatted-rich-text value={msg.highlightedText}></lightning-formatted-rich-text>
                                        <p class="bubble-timestamp">
                                            <lightning-formatted-date-time value={msg.messageTimestamp} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                        </p>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template if:false={hasChatMessages}>
                            <p class="slds-text-body_regular slds-p-around_medium">Esta conversación no tiene mensajes con texto.</p>
                        </template>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cerrar" onclick={closeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
