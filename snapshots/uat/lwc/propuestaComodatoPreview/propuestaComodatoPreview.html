<template>
    <div class="slds-box slds-m-around_medium" style="background: white; overflow: auto; max-height: 600px;">
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center" style="height: 100px;">
                <lightning-spinner alternative-text="Cargando vista previa..." size="medium"></lightning-spinner>
            </div>
        </template>
        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_medium">
                <p>Error al cargar vista previa:</p>
                <p class="slds-text-body_small">{error.body.message}</p>
            </div>
        </template>
        <div class="html-container" lwc:dom="manual"></div>
    </div>
</template>
