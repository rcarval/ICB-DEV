<template>
    <div>
        <div class="slds-form-element">
            <label class="slds-form-element__label">{label}</label>
        </div>

        <template if:true={loading}>
            <div class="slds-p-around_small slds-text-body_small">Cargando contactos de la cuenta...</div>
        </template>

        <template if:true={hasResults}>
            <div class="slds-m-top_small">
                <lightning-datatable
                    key-field="id"
                    data={results}
                    columns={columns}
                    max-row-selection="1"
                    selected-rows={selectedRows}
                    onrowselection={handlePick}>
                </lightning-datatable>
            </div>
        </template>

        <template if:true={noResults}>
            <div class="slds-m-top_small slds-p-around_small slds-box slds-theme_alert-texture slds-theme_warning">
                No tienes contactos creados en esta cuenta. Debes crear uno para continuar.
            </div>
        </template>

        <template if:true={selectedRecordName}>
            <div class="slds-m-top_small slds-grid slds-wrap slds-align_absolute-center">
                <lightning-badge label={selectedRecordName}></lightning-badge>
                <lightning-button variant="base" label="Limpiar" onclick={clearSelection} class="slds-m-left_small"></lightning-button>
            </div>
        </template>
    </div>
</template>
