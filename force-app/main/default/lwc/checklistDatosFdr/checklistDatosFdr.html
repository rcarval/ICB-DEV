<template>
    <lightning-card title={cardTitle} icon-name="standard:task2">
        <div slot="actions">
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Actualizar"
                title="Actualizar"
                onclick={handleRefresh}
            ></lightning-button-icon>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error">{errorMessage}</div>
            </template>

            <template if:false={isLoading}>
                <template if:false={errorMessage}>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={items} for:item="item">
                            <li key={item.key} class="slds-item slds-p-vertical_x-small">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-icon
                                        icon-name={item.iconName}
                                        variant={item.iconVariant}
                                        size="x-small"
                                        class="slds-m-right_small"
                                    ></lightning-icon>
                                    <div class="slds-col">
                                        <div class="slds-text-title_bold">
                                            {item.label}
                                            <span class="slds-m-left_xx-small slds-text-body_small"
                                                >({item.statusLabel})</span
                                            >
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            {item.detail}
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>

                    <template if:true={showIncompleteBanner}>
                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_small" role="alert">
                            <span class="slds-assistive-text">Advertencia</span>
                            <h2>{summaryMessage}</h2>
                        </div>
                    </template>

                    <template if:true={showCrearCaso}>
                        <div class="slds-m-top_medium">
                            <lightning-button
                                variant="brand"
                                label="Crear Caso"
                                title="Crear Caso"
                                onclick={handleCrearCaso}
                            ></lightning-button>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
