<template>
    <div class="selector-container">
        <!-- Modo de Selección: solo visible para perfiles admin -->
        <template if:true={allowDynamicFilters}>
            <div class="mode-selector">
                <button
                    class={dynamicClass}
                    data-mode="dynamic"
                    onclick={handleModeChange}>
                    Desplegar filtros dinámicos
                </button>
                <button
                    class={guidedClass}
                    data-mode="guided"
                    onclick={handleModeChange}>
                    Filtro guiado
                </button>
            </div>
        </template>

        <!-- Banner de selección activa -->
        <template if:true={selectedMachine}>
            <div class="selection-banner">
                <lightning-icon icon-name="utility:check_circle" size="small" class="banner-icon"></lightning-icon>
                <span class="banner-text">Seleccionada: <strong>{selectedMachine.Name}</strong></span>
                <button class="banner-clear-btn" onclick={clearSelection}>✕ Cambiar</button>
            </div>
        </template>

        <!-- Encabezado -->
        <div class="selector-header">
            <lightning-icon icon-name="standard:product" size="medium"></lightning-icon>
            <h2>Selector de Máquina</h2>
            <p class="subtitle">Filtra y selecciona la máquina ideal para el cliente</p>
        </div>

        <!-- FILTROS DINÁMICOS -->
        <template if:true={isDynamicMode}>
            <div class="filters-grid">
                <div class="filter-item">
                    <label class="filter-label">1. Tipo de Negocio</label>
                    <select class="filter-select" value={filterNegocio} onchange={handleTipoNegocioChange}>
                        <option value="">— Todos —</option>
                        <template for:each={tiposNegocio} for:item="opt">
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        </template>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">2. Metodología de Café</label>
                    <select class="filter-select" value={filterMetodologia} onchange={handleMetodologiaChange}>
                        <option value="">— Todas —</option>
                        <template for:each={availableMetodologias} for:item="opt">
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        </template>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">3. Tipo de Flujo</label>
                    <select class="filter-select" value={filterFlujo} onchange={handleFlujoChange}>
                        <option value="">— Todos —</option>
                        <template for:each={availableFlujos} for:item="opt">
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        </template>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">4. Volumen Diario</label>
                    <select class="filter-select" value={filterVolumen} onchange={handleVolumenChange}>
                        <option value="">— Todos —</option>
                        <template for:each={availableVolumenes} for:item="opt">
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        </template>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">Tipo de Leche</label>
                    <select class="filter-select" value={filterLeche} onchange={handleTipoLecheChange}>
                        <option value="">— Todos —</option>
                        <template for:each={availableLeches} for:item="opt">
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        </template>
                    </select>
                </div>
                <div class="filter-item filter-search">
                    <label class="filter-label">Buscar por Nombre</label>
                    <div class="search-wrapper">
                        <lightning-icon icon-name="utility:search" size="x-small" class="search-icon"></lightning-icon>
                        <input
                            type="text"
                            class="filter-input"
                            placeholder="Ej: KREA TOUCH..."
                            oninput={handleSearchChange}
                        />
                    </div>
                </div>
            </div>
        </template>

        <!-- FILTRO GUIADO -->
        <template if:true={isGuidedMode}>
            <div class="guided-container">
                <!-- Paso 1: Negocio -->
                <div class="guided-step">
                    <div class="filter-item">
                        <label class="filter-label">¿Cuál es el tipo de negocio del cliente?</label>
                        <select class="filter-select" value={filterNegocio} onchange={handleTipoNegocioChange}>
                            <option value="">— Seleccionar —</option>
                            <template for:each={tiposNegocio} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- Paso 2: Metodología -->
                <template if:true={showStep2}>
                    <div class="guided-step">
                        <div class="filter-item">
                            <label class="filter-label">¿Qué metodología de café prefieren?</label>
                            <select class="filter-select" value={filterMetodologia} onchange={handleMetodologiaChange}>
                                <option value="">— Seleccionar —</option>
                                <template for:each={availableMetodologias} for:item="opt">
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </template>

                <!-- Paso 3: Flujo -->
                <template if:true={showStep3}>
                    <div class="guided-step">
                        <div class="filter-item">
                            <label class="filter-label">¿Cuál es el flujo de atención esperado?</label>
                            <select class="filter-select" value={filterFlujo} onchange={handleFlujoChange}>
                                <option value="">— Seleccionar —</option>
                                <template for:each={availableFlujos} for:item="opt">
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </template>

                <!-- Paso 4: Volumen -->
                <template if:true={showStep4}>
                    <div class="guided-step">
                        <div class="filter-item">
                            <label class="filter-label">¿Cuál es el volumen diario estimado?</label>
                            <select class="filter-select" value={filterVolumen} onchange={handleVolumenChange}>
                                <option value="">— Seleccionar —</option>
                                <template for:each={availableVolumenes} for:item="opt">
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </template>

                <!-- Paso 5: Leche -->
                <template if:true={showStep5}>
                    <div class="guided-step">
                        <div class="filter-item">
                            <label class="filter-label">¿Qué tipo de leche utilizarán?</label>
                            <select class="filter-select" value={filterLeche} onchange={handleTipoLecheChange}>
                                <option value="">— Seleccionar —</option>
                                <template for:each={availableLeches} for:item="opt">
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- Conteo de resultados -->
        <template if:true={showResults}>
            <div class="results-bar">
                <span class="results-count">
                    <template if:true={selectedMachine}>
                        ✅ Máquina seleccionada: <strong>{selectedMachine.Name}</strong>
                    </template>
                    <template if:false={selectedMachine}>
                        {filteredMachines.length} máquinas encontradas
                    </template>
                </span>
                <template if:true={selectedMachine}>
                    <button class="clear-btn" onclick={clearSelection}>✕ Cambiar selección</button>
                </template>
                <button class="clear-filters-btn-sm" onclick={clearFilters}>Limpiar filtros</button>
            </div>
        </template>

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="loading-container">
                <lightning-spinner alternative-text="Cargando..." size="medium"></lightning-spinner>
                <p>Cargando máquinas...</p>
            </div>
        </template>

        <!-- Sin resultados -->
        <template if:true={noResults}>
            <div class="no-results">
                <lightning-icon icon-name="utility:error" size="large"></lightning-icon>
                <p>No se encontraron máquinas con los filtros seleccionados.</p>
                <button class="clear-filters-btn" onclick={clearFilters}>Limpiar filtros</button>
            </div>
        </template>

        <!-- Tarjetas de máquinas -->
        <template if:true={showResults}>
            <template if:false={isLoading}>
                <div class="machines-grid">
                    <template for:each={filteredMachines} for:item="machine">
                        <div
                            key={machine.Id}
                            class={machine.cardClass}
                            onclick={handleSelectMachine}
                            data-id={machine.Id}
                            data-name={machine.Name}
                        >
                            <div class="card-icon">
                                <lightning-icon icon-name="standard:product" size="large"></lightning-icon>
                            </div>
                            <div class="card-body">
                                <h3 class="machine-name">{machine.Name}</h3>
                                <template if:true={machine.Metodologia__c}>
                                    <span class="badge badge-metodologia">{machine.Metodologia__c}</span>
                                </template>
                                <template if:true={machine.Tipo_de_Leche__c}>
                                    <span class="badge badge-leche">{machine.Tipo_de_Leche__c}</span>
                                </template>
                                <template if:true={machine.Capacidad_Sugerida__c}>
                                    <p class="machine-capacidad">📊 {machine.Capacidad_Sugerida__c}</p>
                                </template>
                            </div>
                            <div class="card-check">
                                <template if:true={machine.isSelected}>
                                    <lightning-icon icon-name="utility:check" size="small" class="check-icon"></lightning-icon>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </template>
    </div>
</template>
