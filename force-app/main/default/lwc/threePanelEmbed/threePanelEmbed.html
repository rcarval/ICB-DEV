<template>
    <template if:true={error}>
        <p style="color: red;">{error}</p>
    </template>

    <template if:true={loading}>
        <p>Cargando paneles…</p>
    </template>

    <template if:true={urls}>
        <div class="three-column-container" style="display:flex; width:100%; gap:10px;">
            <div class="column" style="flex:1;">
                <iframe src={urls.url1} width="100%" height="600px" frameborder="0" scrolling="true"></iframe>
            </div>
            <div class="column" style="flex:1;">
                <iframe src={urls.url2} width="100%" height="600px" frameborder="0" scrolling="true"></iframe>
            </div>
            <div class="column" style="flex:1;">
                <iframe src={urls.url3} width="100%" height="600px" frameborder="0" scrolling="true"></iframe>
            </div>
        </div>
    </template>
</template>
