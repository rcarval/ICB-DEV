<template>
    <!-- Contenedor para los botones -->
    <div class="button-container " 
    style="width: 100%; margin-bottom: 10px; height: 40px; display: flex; align-items: center; background-color: #f4f6f9; padding: 5px; border-radius: 5px;">
        <lightning-button
            label="Recargar Dashboard"
            onclick={handleReload}
            disabled={loading}
            class="slds-m-right_small">
        </lightning-button>

        <lightning-button
            label="Ir a Quicksight"
            onclick={handleGoToUrl}>
        </lightning-button>

        <lightning-combobox
        style="margin-left: 10px; margin-top: -15px;"
        name="dashboardSelect"
        value={selectedValue}
        placeholder="Seleccione un dashboard"
        options={options}
        onchange={handleSelectionChange}
        class="slds-m-right_small">
    </lightning-combobox>

        <template if:true={loading} style="width: 100%;">
            <p style="color:black; font-size:20px;position:absolute;margin-left: 520px; width: 100%;  display: flex;">Cargando Dashboard...</p>
        </template>
    </div>

    <template if:true={error}>
        <p style="color: red;">{error}</p>
    </template>

    <template if:true={embedUrl}>
        <iframe
            src={embedUrl}
            width="100%"
            height="1700px"
            frameborder="0"
            scrolling="true">
        </iframe>
    </template>
</template>
