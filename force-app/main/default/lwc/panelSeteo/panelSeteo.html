<template>
    <lightning-card title="Panel de Seteo" icon-name="standard:pricebook">
        <!-- Sección de Encabezado -->
        <div class="slds-grid slds-wrap slds-p-around_medium slds-box slds-theme_shade slds-m-bottom_medium">
            <div class="slds-col slds-size_1-of-2">
                <p class="slds-text-heading_medium">Cliente: {accountName}</p>
                <p class="slds-text-body_regular">{encabezado}</p>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-text-align_right">
                <div class="slds-button-group">
                    <lightning-button variant="neutral" label="Agregar Productos" onclick={handleAddProduct} class="slds-m-right_medium"></lightning-button>
                    <lightning-button variant="neutral" label="Draft" onclick={handleDraft}></lightning-button>
                    <lightning-button variant="neutral" label="Setear" onclick={handleSetear}></lightning-button>
                </div>
                <template if:false={shouldHideButton}>
                    <lightning-button variant="brand" label="Atrás" onclick={handleAtras} class="slds-m-left_medium"></lightning-button>
                </template>
            </div>
        </div>

        <!-- Spinner mientras se cargan los datos -->
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Cargando..." size="medium"></lightning-spinner>
        </template>

        <!-- Tabla de Registros usando lightning-datatable -->
        <template if:false={showSpinner}>
            <lightning-datatable
                class="slds-m-around_medium"
                key-field="id"
                data={productDataDraft}
                columns={columns}
                hide-checkbox-column="true"
                suppress-bottom-bar="true"
                oncellchange={handleCellChange}
                draft-values={draftValues}
                >
            ></lightning-datatable>
        </template>

        <!-- Modal Structure -->
        <template if:true={showModal}>
            <section role="dialog" class="slds-modal slds-fade-in-open full-screen-modal">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-button_icon-inverse slds-modal__close" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Seleccionar Productos</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <c-lookup-datatable
                            selected-account-id={accountIdValue}
                            onrecorddatachange={handleSelectProducts}
                        ></c-lookup-datatable>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancelar" onclick={handleCloseModal}></lightning-button>
                        <lightning-button variant="brand" label="Continuar" onclick={handleModalContinue}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
